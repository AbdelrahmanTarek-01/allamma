<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حزّورة · السرقة والإجابة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#111}a:hover{color:#333}
@keyframes bannerIn{0%{transform:translateY(-30px) rotate(-3deg);opacity:0}60%{transform:translateY(4px) rotate(1deg);opacity:1}100%{transform:none}}
@keyframes flyUp{0%{transform:translateY(0) scale(.6);opacity:0}25%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-260px) scale(.7);opacity:0}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
@keyframes rightGlow{0%{box-shadow:0 0 0 0 #3DDC97}100%{box-shadow:0 0 0 10px rgba(61,220,151,0)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">

  <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="background: #fff; border: 3px solid #111; border-radius: 16px; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12.5px; font-weight: 900">الأزرق</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px">١٬٤٠٠</span>
    </div>
    <div style="background: #FF8A3D; border: 3px solid #111; border-radius: 16px; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; animation: {{scoreBump}}">
      <span style="font-size: 12.5px; font-weight: 900">البرتقالي</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px">{{orangeScore}}</span>
    </div>
  </section>

  <div style="background: #111; color: #fff; border: 3px solid #111; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; animation: bannerIn .5s cubic-bezier(.2, 1.4, .4, 1)">
    <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M3 12h14M11 5l7 7-7 7" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px; color: #FFD23F">{{bannerTitle}}</span>
      <span style="font-size: 13px; font-weight: 700">{{bannerSub}}</span>
    </div>
    <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 24px; color: #FF8A3D">{{timer}}</span>
  </div>

  <section style="background: #fff; border: 3px solid #111; border-radius: 22px; box-shadow: 5px 5px 0 #111; padding: 14px 16px">
    <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.35">النادي الأهلي اتأسس سنة كام؟</span>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
      <button onClick="{{o.pick}}" disabled="{{o.off}}" style="position: relative; min-height: 58px; border: 3px solid #111; border-radius: 18px; background: {{o.bg}}; box-shadow: {{o.shadow}}; display: flex; align-items: center; gap: 12px; padding: 6px 12px; font-family: 'Cairo', sans-serif; color: #111; text-align: right; opacity: {{o.op}}; animation: {{o.anim}}">
        <span style="width: 34px; height: 34px; flex: none; border-radius: 10px; border: 2.5px solid #111; background: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 17px">{{o.key}}</span>
        <span style="flex: 1; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px; text-decoration: {{o.strike}}">{{o.text}}</span>
        <span style="font-size: 12px; font-weight: 900">{{o.tag}}</span>
      </button>
    </sc-for>
  </section>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <span aria-hidden="true" style="display: {{flyShow}}; position: absolute; left: 50%; top: 330px; margin-left: -60px; width: 120px; text-align: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 40px; color: #111; text-shadow: 3px 3px 0 #fff; animation: flyUp 1.1s cubic-bezier(.3, .7, .4, 1) forwards">+٤٠٠</span>
    <div style="background: #fff; border: 3px solid #111; border-radius: 18px; box-shadow: 0 0 0 4px {{endRing}}; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; animation: bannerIn .45s cubic-bezier(.2, 1.4, .4, 1)">
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px">{{endTitle}}</span>
      <span style="font-size: 12.5px; font-weight: 700">الأهلي اتأسس سنة ١٩٠٧ على إيد طلبة المدارس العليا</span>
    </div>
  </sc-if>

  <button onClick="{{reset}}" style="margin-top: auto; height: 50px; border: 2.5px solid #111; border-radius: 16px; background: #fff; box-shadow: 3px 3px 0 #111; font: 900 15px 'Cairo', sans-serif">{{resetLabel}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pick: null };
}
renderVals() {
const s = this.state;
const done = s.pick !== null;
const OPTS = [['أ', '١٩١١', 'wrong'], ['ب', '١٩٠٧', 'right'], ['ج', '١٩٢٠', ''], ['د', '١٨٩٩', '']];
return {
done,
flyShow: s.pick === 'ب' ? 'block' : 'none',
endRing: s.pick === 'ب' ? '#3DDC97' : '#FF8A80',
endTitle: s.pick === 'ب' ? 'البرتقالي سرقوها! +٤٠٠' : 'حتى السرقة غلط! محدش خد النقط',
orangeScore: done && s.pick === 'ب' ? '١٬٤٠٠' : '١٬٠٠٠',
scoreBump: done && s.pick === 'ب' ? 'bump .5s ease .9s' : 'none',
bannerTitle: 'الأزرق غلط! فرصتكم تسرقوها',
bannerSub: 'الأزرق اختار ١٩١١ · معاكم ١٠ ثواني بس',
timer: done ? '✓' : '٠:٠٨',
opts: OPTS.map(([key, text, kind]) => {
const wrongBlue = kind === 'wrong';
const isRight = kind === 'right';
const mine = s.pick === key;
let bg = '#fff', tag = '', anim = 'none', shadow = '4px 4px 0 #111';
if (wrongBlue) { bg = '#f3ecd0'; tag = 'الأزرق اختارها'; shadow = 'none'; }
if (done && isRight) { bg = '#3DDC97'; tag = mine ? 'صح! ✓' : 'دي الصح'; anim = 'rightGlow .8s ease-out 2'; }
if (done && mine && !isRight) { bg = '#FF8A80'; tag = 'غلط'; anim = 'shake .45s'; }
return { key, text, tag, bg, shadow, anim, off: wrongBlue || done, op: wrongBlue ? 0.55 : 1, strike: wrongBlue ? 'line-through' : 'none', pick: () => { if (!done && !wrongBlue) this.setState({ pick: key }); } };
}),
reset: () => this.setState({ pick: null }),
resetLabel: done ? 'جرّب تاني' : 'دوس على إجابة عشان تشوف الكشف'
};
}
}
</script>
</body>
</html>
