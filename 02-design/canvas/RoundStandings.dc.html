<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ترتيب بين الجولات · كل الألعاب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#111}a:hover{color:#333}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),900px) rotate(var(--r))}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rays{to{transform:rotate(360deg)}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">
  <header style="display: flex; align-items: center; gap: 8px"><span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 900; background: #fff; border: 2px solid #111; border-radius: 99px; padding: 1px 10px 1px 4px"><span style="width: 14px; height: 14px; border-radius: 5px; border: 2px solid #111; background: {{gc}}"></span>{{gn}}</span><button onClick="{{play}}" aria-label="شغّل تاني" style="margin-inline-start: auto; width: 40px; height: 40px; flex: none; border: 2.5px solid #111; border-radius: 13px; background: #fff; box-shadow: 3px 3px 0 #111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 103-6.7L3 8M3 3v5h5"/></svg></button></header>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">الترتيب بعد {{roundLbl}}</span>
    <div style="display: flex; gap: 5px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span style="flex: 1; height: 10px; border-radius: 99px; border: 2px solid #111; background: {{d.bg}}; animation: {{d.anim}}"></span></sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; background: #111; color: #fff; border-radius: 16px; padding: 8px 12px; opacity: {{hlOp}}">
    <span style="width: 10px; height: 26px; border-radius: 99px; background: {{gc}}; border: 2px solid #fff; flex: none"></span>
    <span style="font-size: 13px; font-weight: 800; line-height: 1.5">{{hl}}</span>
  </div>

  <sc-if value="{{isTeam}}" hint-placeholder-val="{{ false }}">
    <section style="background: #fff; border: 3px solid #111; border-radius: 22px; box-shadow: 5px 5px 0 #111; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{teams}}" as="tm" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 18px">{{tm.n}}</span><span style="font-size: 12px; font-weight: 900; color: #1F7A52; opacity: {{tm.gop}}">{{tm.gain}}</span><span style="margin-inline-start: auto; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums">{{tm.tot}}</span></div>
          <span style="height: 24px; border: 2.5px solid #111; border-radius: 99px; overflow: hidden; display: flex; background: #F3ECD0"><span style="width: {{tm.w}}%; background: {{tm.c}}; border-left: 2.5px solid #111"></span></span>
          <span style="display: flex; gap: 4px"><svg width="24" height="24" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{tm.a1}}" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><svg width="24" height="24" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{tm.a2}}" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><svg width="24" height="24" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{tm.a3}}" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg></span>
        </div>
      </sc-for>
    </section>
  </sc-if>
  <sc-if value="{{isSolo}}" hint-placeholder-val="{{ true }}">
    <section style="position: relative; background: #fff; border: 3px solid #111; border-radius: 22px; box-shadow: 5px 5px 0 #111; height: 290px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="position: absolute; left: 10px; right: 10px; top: {{r.top}}px; height: 54px; display: flex; align-items: center; gap: 8px; border-radius: 14px; background: {{r.bg}}; padding: 0 8px">
          <span style="width: 24px; text-align: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px">{{r.rank}}</span>
          <svg width="34" height="34" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{r.c}}" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg>
          <div style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-weight: 900; font-size: 15px">{{r.n}}</span><span style="font-size: 11px; font-weight: 900; color: {{r.mvC}}; opacity: {{r.mvOp}}">{{r.mv}}</span></div>
          <span style="margin-inline-start: auto; font-size: 13px; font-weight: 900; color: #1F7A52; background: #D4F7E8; border: 2px solid #111; border-radius: 99px; padding: 0 8px; opacity: {{r.gop}}; transform: scale({{r.gs}})">{{r.gain}}</span>
          <span style="min-width: 58px; text-align: left; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums">{{r.tot}}</span>
        </div>
      </sc-for>
    </section>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="position: relative; width: 52px; height: 52px; flex: none">
        <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="transform: rotate(-90deg)"><circle cx="26" cy="26" r="22" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="26" cy="26" r="17" fill="none" stroke="{{gc}}" stroke-width="6" stroke-dasharray="106.8" stroke-dashoffset="{{ring}}" stroke-linecap="round"/></svg>
        <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 19px">{{secs}}</span>
      </span>
      <div style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-weight: 900; font-size: 15px">الجولة الجاية بتبدأ لوحدها</span><span style="font-size: 12px; font-weight: 800">{{nextLbl}}</span></div>
    </div>
    <button style="height: 58px; border: 3px solid #111; border-radius: 18px; background: #111; color: #FFD23F; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 {{gc}}">كمّل دلوقتي</button>
    <span style="font-size: 12px; font-weight: 800; text-align: center; opacity: .75">الزرار للهوست بس · الباقي بيستنى العداد</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"game": {"editor": "enum", "options": ["spy", "geo", "wave", "quiz", "words", "auction", "draw"], "default": "spy"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { t: 99 };
this.raf = 0;
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
renderVals() {
const GAMES = {"spy": {"n": "مين الجاسوس؟", "c": "#FF4F9A", "team": false, "unit": "نقطة", "hl": "الجولة دي: الجاسوس كان كريم · سارة مسكته", "aw": [["أشطر محقق", "سارة", "مسكت الجاسوس ٣ مرات"], ["أحسن جاسوس", "كريم", "هرب مرتين وخمّن المكان"]]}, "geo": {"n": "فين دي؟", "c": "#3DDC97", "team": false, "unit": "نقطة", "hl": "الجولة دي: أقرب دبوس لمازن · ١٢ كم بس", "aw": [["عين الصقر", "مازن", "متوسط بُعده ٤٠ كم"], ["التايه", "نور", "حطّت أسوان في إسكندرية"]]}, "wave": {"n": "الموجة", "c": "#4D9DFF", "team": false, "unit": "نقطة", "hl": "الجولة دي: سارة جابتها في النص بالظبط", "aw": [["قارئ الأفكار", "سارة", "٣ مرات في النص بالظبط"], ["أحسن راوي", "إنت", "الكل قرّب من تلميحك"]]}, "quiz": {"n": "حزّورة", "c": "#B48CFF", "team": true, "unit": "نقطة", "hl": "الجولة دي: البرتقالي سرق سؤال الـ ٦٠٠", "aw": [["نجم الماتش", "سارة", "جاوبت ٦ صح من ٧"], ["أحلى لحظة", "سرقة الـ ٦٠٠", "في آخر ٣ ثواني"]]}, "words": {"n": "شبكة الكلمات", "c": "#3DDC97", "team": true, "unit": "لوحة", "hl": "اللوحة دي: الأزرق قلب القنبلة", "aw": [["أحسن دليل", "مازن", "«مية · ٤» وجابوها كلها"], ["ضحية القنبلة", "كريم", "قلب «توكتوك»"]]}, "auction": {"n": "مزاد المعلومات", "c": "#FF8A3D", "team": false, "unit": "ج", "hl": "المعلومة دي: مازن اشترى بـ ٤٠٠ وجاوب صح", "aw": [["أغلى معلومة", "مازن", "اشترى بـ ٧٠٠ وجابها"], ["أشجع مزايد", "كريم", "زايد بكل فلوسه مرتين"]]}, "draw": {"n": "ارسم وخمّن", "c": "#FFD23F", "team": false, "unit": "نقطة", "hl": "الجولة دي: «فانوس» · ٣ من ٤ خمّنوها", "aw": [["فنان الليلة", "مازن", "أكتر قلوب في المعرض"], ["أسرع إيد", "سارة", "خمّنت أول واحدة ٤ مرات"]]}};
const AR = (n) => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
const back = (v) => { v = clamp(v); const c = 1.7; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const g = GAMES[this.props.game ?? 'spy'] || GAMES.spy, t = this.state.t;
const ROUNDS = 6, R = g.team ? 2 : 3;
const P = [['سارة', '#B48CFF', 34, 15], ['مازن', '#3DDC97', 30, 20], ['إنت', '#4D9DFF', 26, 18], ['نور', '#FF4F9A', 22, 5], ['كريم', '#FF8A3D', 25, 0]];
const scale = g.unit === 'ج' ? 30 : g.unit === 'لوحة' ? 1 : 10;
const k = ease((t - 0.7) / 1.1);
const val = (p) => (p[2] + p[3] * k) * scale;
const before = P.slice().sort((a, b) => b[2] - a[2]).map(p => p[0]);
const after = P.slice().sort((a, b) => val(b) - val(a));
const fmt = (v) => AR(Math.round(v)) + (g.unit === 'ج' ? ' ج' : '');
const rows = after.map((p, i) => { const oi = before.indexOf(p[0]); const mv = oi - after.findIndex(x => x[0] === p[0]); const sorted = P.slice().sort((a, b) => (b[2] + b[3]) - (a[2] + a[3])).findIndex(x => x[0] === p[0]); return {
n: p[0], c: p[1], rank: AR(i + 1), top: (6 + 56 * i).toFixed(1), bg: p[0] === 'إنت' ? '#DCEBFF' : 'transparent',
gain: p[3] ? '+' + fmt(p[3] * scale) : '—', gop: clamp((t - 0.3) / 0.3).toFixed(2), gs: back((t - 0.3) / 0.4).toFixed(2),
tot: fmt(val(p)), mv: t > 1.9 && sorted !== oi ? (oi > sorted ? '▲ طلع ' + AR(oi - sorted) : '▼ نزل ' + AR(sorted - oi)) : '', mvC: oi > sorted ? '#1F9E6A' : '#E2433B', mvOp: clamp((t - 1.9) / 0.3).toFixed(2) }; });
const TA = g.unit === 'لوحة' ? [1, 1] : [1800, 1400], TG = g.unit === 'لوحة' ? [1, 0] : [600, 200];
const tv = TA.map((a, i) => a + TG[i] * k), mx = Math.max(...TA.map((a, i) => a + TG[i])) * 1.15;
const left = Math.max(0, Math.ceil(8 - t));
return {
gn: g.n, gc: g.c, hl: g.hl, hlOp: clamp(t / 0.3).toFixed(2), isTeam: g.team, isSolo: !g.team,
roundLbl: g.unit === 'لوحة' ? 'لوحة ' + AR(R) + ' من ٣' : (g.n === 'مزاد المعلومات' ? 'معلومة ' : 'جولة ') + AR(R) + ' من ' + AR(ROUNDS),
dots: Array.from({ length: g.unit === 'لوحة' ? 3 : ROUNDS }, (_, i) => ({ bg: i < R ? g.c : '#fff', anim: i === R - 1 ? 'pop .4s .2s both' : 'none' })),
rows,
teams: [['البرتقالي', '#FF8A3D', '#FF8A3D', '#B48CFF', '#FFD23F'], ['الأزرق', '#4D9DFF', '#4D9DFF', '#3DDC97', '#FF4F9A']].map((x, i) => ({ n: x[0], c: x[1], a1: x[2], a2: x[3], a3: x[4], tot: g.unit === 'لوحة' ? AR(Math.round(tv[i])) + ' لوحة' : AR(Math.round(tv[i] / 10) * 10), gain: TG[i] ? '+' + AR(TG[i]) : '', gop: clamp((t - 0.3) / 0.3).toFixed(2), w: (tv[i] / mx * 100).toFixed(1) })),
secs: AR(left), ring: (106.8 * (1 - left / 8)).toFixed(1),
nextLbl: 'فاضل ' + AR(ROUNDS - R) + (g.unit === 'لوحة' ? ' لوحة' : ' جولات') + ' · الكل لسه في الماتش',
play: () => { cancelAnimationFrame(this.raf); const t0 = performance.now(); const tick = (now) => { const tt = (now - t0) / 1000; this.setState({ t: tt }); if (tt < 9) this.raf = requestAnimationFrame(tick); }; this.raf = requestAnimationFrame(tick); },
};
}
}
</script>
</body>
</html>
