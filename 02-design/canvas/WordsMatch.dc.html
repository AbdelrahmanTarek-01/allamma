<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شبكة الكلمات · نتيجة الماتش</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#111}a:hover{color:#333}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),900px) rotate(var(--r))}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes rays{to{transform:rotate(360deg)}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">

  <section style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px">
    <div aria-hidden="true" style="position: absolute; top: -70px; left: 50%; width: 380px; height: 380px; margin-left: -190px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.45) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: rays 18s linear infinite; opacity: {{raysOp}}; -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%)"></div>
    <svg width="104" height="104" viewBox="0 0 64 64" aria-hidden="true" style="position: relative; transform: scale({{cupS}}) rotate({{cupR}}deg)">
      <path d="M18 8h28v14a14 14 0 01-28 0z" fill="#FFD23F" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M18 12H9a8 8 0 008 10M46 12h9a8 8 0 01-8 10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 36h8v8h-8z" fill="#FF8A3D" stroke="#111" stroke-width="3"/>
      <path d="M20 44h24v8H20z" fill="#4D9DFF" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M26 16l2 4 4 .6-3 3 .7 4.4-3.7-2-3.7 2 .7-4.4-3-3 4-.6z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span style="position: relative; font-size: 13px; font-weight: 900; background: #fff; border: 2px solid #111; border-radius: 99px; padding: 0 12px; opacity: {{titleOp}}">خلص الماتش · أحسن من ٣ لوحات</span>
    <h1 style="position: relative; margin: 0; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.15; text-align: center; opacity: {{titleOp}}; transform: translateY({{titleY}}px)">البرتقالي كسب الماتش!</h1>
    <div style="position: relative; display: flex; gap: 6px; margin-top: 4px; opacity: {{titleOp}}">
      <svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="animation: hop .6s ease-in-out infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#3DDC97" stroke="#111" stroke-width="3"/><rect x="13" y="25" width="13" height="9" rx="3" fill="#111"/><rect x="30" y="25" width="13" height="9" rx="3" fill="#111"/><path d="M21 39q7 8 14 0z" fill="#111"/></svg>
      <svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="animation: hop .6s ease-in-out .15s infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#B48CFF" stroke="#111" stroke-width="3"/><path d="M28 12L17 5v13zM28 12l11-7v13z" fill="#FFD23F" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/><path d="M23 39q5 5 10 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg>
      <svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="animation: hop .6s ease-in-out .3s infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#FF8A3D" stroke="#111" stroke-width="3"/><path d="M7 31a21 21 0 0142 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/><rect x="3" y="25" width="9" height="14" rx="3.5" fill="#111"/><rect x="44" y="25" width="9" height="14" rx="3.5" fill="#111"/><path d="M17 31q4-4 8 0M31 31q4-4 8 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/><path d="M23 39q5 5 10 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
  </section>


  <section style="background: #fff; border: 3px solid #111; border-radius: 22px; box-shadow: 5px 5px 0 #111; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 14px">
      <span style="display: flex; flex-direction: column; align-items: center; line-height: 1"><span style="font-size: 12px; font-weight: 900">البرتقالي</span><span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 40px; color: #111; background: #FF8A3D; border: 3px solid #111; border-radius: 14px; padding: 2px 14px; margin-top: 4px">{{oScore}}</span></span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 28px; padding-top: 16px">–</span>
      <span style="display: flex; flex-direction: column; align-items: center; line-height: 1"><span style="font-size: 12px; font-weight: 900">الأزرق</span><span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 40px; color: #111; background: #4D9DFF; border: 3px solid #111; border-radius: 14px; padding: 2px 14px; margin-top: 4px">{{bScore}}</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{boards}}" as="r" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: center; opacity: {{r.op}}; transform: translateX({{r.x}}px)">
          <span style="font-size: 12px; font-weight: 900; opacity: .7">{{r.n}}</span>
          <span style="font-size: 13px; font-weight: 800">{{r.how}}</span>
          <span style="font-size: 12px; font-weight: 900; background: {{r.c}}; border: 2px solid #111; border-radius: 99px; padding: 0 10px">{{r.w}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{awards}}" as="a" hint-placeholder-count="4">
      <div style="background: #fff; border: 3px solid #111; border-radius: 18px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; opacity: {{a.op}}; transform: translateY({{a.y}}px)">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; border: 2px solid #111; background: {{a.c}}"></span><span style="font-size: 11.5px; font-weight: 900; opacity: .75">{{a.k}}</span></span>
        <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 19px">{{a.who}}</span>
        <span style="font-size: 11.5px; font-weight: 800">{{a.why}}</span>
      </div>
    </sc-for>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button onClick="{{play}}" style="height: 58px; border: 3px solid #111; border-radius: 18px; background: #111; color: #FFD23F; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 23px; box-shadow: 0 6px 0 #FF8A3D">ماتش جديد</button>
    <button style="height: 48px; border: 2.5px solid #111; border-radius: 16px; background: #fff; box-shadow: 3px 3px 0 #111; font: 900 15px 'Cairo', sans-serif">نغيّر اللعبة</button>
  </div>

  <sc-if value="{{party}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
      <sc-for list="{{confetti}}" as="c" hint-placeholder-count="22">
        <span style="position: absolute; top: -20px; left: {{c.x}}%; width: {{c.w}}px; height: {{c.h}}px; background: {{c.color}}; border: 1.5px solid #111; border-radius: 2px; animation: fall {{c.dur}}s cubic-bezier(.3, .6, .5, 1) {{c.delay}}s forwards; --r: {{c.r}}deg; --dx: {{c.dx}}px"></span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { t: 99 };
this.raf = 0;
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
renderVals() {
const AR = (n) => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
const back = (v) => { v = clamp(v); const c = 1.7; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const t = this.state.t;
const B = [['لوحة ١', 'كشفوا كل كلماتهم', 'الأزرق', '#4D9DFF', 'b'], ['لوحة ٢', 'الأزرق قلب القنبلة', 'البرتقالي', '#FF8A3D', 'o'], ['لوحة ٣', 'سبقوا بكلمتين', 'البرتقالي', '#FF8A3D', 'o']];
const at = (i) => 0.3 + i * 0.55;
let o = 0, b = 0;
B.forEach((r, i) => { if (t > at(i) + 0.3) { if (r[4] === 'o') o++; else b++; } });
const T = at(3) + 0.2;
const AW = [['أحسن دليل', 'مازن', '«مية · ٤» وجابوها كلها', '#FF8A3D'], ['صياد الكلمات', 'سارة', 'قلبت ٨ صح', '#FF8A3D'], ['ضحية القنبلة', 'كريم', 'قلب «توكتوك»', '#4D9DFF'], ['ثقة زيادة', 'يوسف', 'خمّن ٣ ورا بعض', '#4D9DFF']];
return {
oScore: AR(o), bScore: AR(b),
boards: B.map((r, i) => ({ n: r[0], how: r[1], w: r[2], c: r[3], op: clamp((t - at(i)) / 0.3).toFixed(2), x: (-16 * (1 - ease((t - at(i)) / 0.4))).toFixed(1) })),
cupS: (0.3 + 0.7 * back((t - T) / 0.6)).toFixed(2), cupR: (-20 * (1 - clamp((t - T) / 0.7))).toFixed(1),
raysOp: clamp((t - T - 0.2) / 0.5).toFixed(2),
titleOp: clamp((t - T - 0.3) / 0.3).toFixed(2), titleY: (12 * (1 - ease((t - T - 0.3) / 0.4))).toFixed(1),
awards: AW.map((a, i) => { const k = T + 0.8 + i * 0.15; return { k: a[0], who: a[1], why: a[2], c: a[3], op: clamp((t - k) / 0.3).toFixed(2), y: (14 * (1 - ease((t - k) / 0.4))).toFixed(1) }; }),
party: t > T && t < T + 5,
confetti: Array.from({ length: 22 }, (_, i) => ({ x: (i * 41) % 100, w: 7 + (i % 3) * 3, h: 10 + (i % 2) * 5, color: ['#FF8A3D', '#FFD23F', '#fff', '#4D9DFF', '#FF4F9A', '#3DDC97'][i % 6], dur: (2.2 + (i % 5) * 0.35).toFixed(2), delay: ((i % 7) * 0.1).toFixed(2), r: 260 + i * 35, dx: ((i % 2 ? 1 : -1) * (15 + i * 4)) })),
play: () => {
cancelAnimationFrame(this.raf);
const t0 = performance.now();
const tick = (now) => { const tt = (now - t0) / 1000; this.setState({ t: tt }); if (tt < 8) this.raf = requestAnimationFrame(tick); };
this.raf = requestAnimationFrame(tick);
}
};
}
}
</script>
</body>
</html>
