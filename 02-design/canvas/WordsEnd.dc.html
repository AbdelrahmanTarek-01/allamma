<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شبكة الكلمات · القنبلة والفوز</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#111}a:hover{color:#333}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.55}100%{transform:translateY(-320px) scale(1.6);opacity:0}}
@keyframes ember{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-560px) scale(.3);opacity:0}}
@keyframes flick{0%,100%{opacity:.9}50%{opacity:.55}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),900px) rotate(var(--r))}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: {{ink}}; background: {{bg}}; transform: translate({{shakeX}}px, {{shakeY}}px)">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: #fff; opacity: {{flash}}; pointer-events: none"></div>
  <sc-if value="{{smoke}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
      <span style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,138,61,.35) 1.6px, transparent 1.8px); background-size: 12px 12px; -webkit-mask-image: radial-gradient(circle at 50% 27%, #000 0%, transparent 62%); mask-image: radial-gradient(circle at 50% 27%, #000 0%, transparent 62%)"></span>
      <span style="position: absolute; left: 50%; top: 27%; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,138,61,.45), rgba(226,67,59,.12) 45%, transparent 70%); animation: flick 1.6s ease-in-out infinite"></span>
      <sc-for list="{{embers}}" as="e" hint-placeholder-count="14">
        <span style="position: absolute; bottom: -10px; left: {{e.x}}%; width: {{e.s}}px; height: {{e.s}}px; border-radius: 50%; background: {{e.c}}; box-shadow: 0 0 8px {{e.c}}; animation: ember {{e.d}}s linear {{e.delay}}s infinite"></span>
      </sc-for>
    </div>
  </sc-if>

  <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center; position: relative">
    <span style="font-size: 12.5px; font-weight: 900; background: #fff; color: #111; border: 2px solid #111; border-radius: 99px; padding: 0 10px">{{tag}}</span>
    <button onClick="{{play}}" aria-label="شغّل تاني" style="width: 42px; height: 42px; border: 2.5px solid #111; border-radius: 14px; background: #fff; box-shadow: 3px 3px 0 #111; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 103-6.7L3 8M3 3v5h5"/></svg></button>
  </div>

  <div style="position: relative; z-index: 1; width: 260px; height: 260px; flex: none; display: flex; align-items: center; justify-content: center; margin-top: 10px">
    <sc-for list="{{rings}}" as="r" hint-placeholder-count="3">
      <span aria-hidden="true" style="position: absolute; width: {{r.size}}px; height: {{r.size}}px; border-radius: 50%; border: 6px solid {{r.color}}; opacity: {{r.op}}"></span>
    </sc-for>
    <sc-for list="{{bits}}" as="b" hint-placeholder-count="10">
      <span aria-hidden="true" style="position: absolute; width: 18px; height: 18px; border: 2.5px solid #111; border-radius: 4px; background: {{b.color}}; transform: translate({{b.x}}px, {{b.y}}px) rotate({{b.r}}deg); opacity: {{b.op}}"></span>
    </sc-for>
    <sc-if value="{{isBomb}}" hint-placeholder-val="{{ true }}">
      <svg width="170" height="170" viewBox="0 0 64 64" aria-hidden="true" style="transform: scale({{bombS}}) rotate({{bombR}}deg); opacity: {{bombOp}}">
        <circle cx="28" cy="38" r="20" fill="#111" stroke="#fff" stroke-width="3"/>
        <circle cx="21" cy="31" r="5" fill="#fff" opacity=".35"/>
        <rect x="34" y="14" width="10" height="9" rx="2" transform="rotate(35 39 18)" fill="#555" stroke="#fff" stroke-width="2.5"/>
        <path d="M44 12q6-6 12-2" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="56" cy="10" r="{{spark}}" fill="#FFD23F" stroke="#FF8A3D" stroke-width="2"/>
      </svg>
    </sc-if>
    <sc-if value="{{isWin}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(3, 62px); gap: 8px; transform: scale({{winS}})">
        <sc-for list="{{winCards}}" as="w" hint-placeholder-count="6">
          <span style="height: 50px; border: 2.5px solid #111; border-radius: 12px; background: #4D9DFF; display: flex; align-items: center; justify-content: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 14px; color: #111; transform: rotate({{w.r}}deg); box-shadow: 3px 3px 0 #111">{{w.t}}</span>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{burst}}" hint-placeholder-val="{{ false }}">
      <svg width="320" height="320" viewBox="-160 -160 320 320" aria-hidden="true" style="position: absolute; overflow: visible; transform: scale({{burstS}}) rotate({{burstR}}deg)">
        <polygon points="{{burstOuter}}" fill="#E2433B" stroke="#111" stroke-width="5" stroke-linejoin="round" transform="translate(9 9)" opacity=".9"/>
        <polygon points="{{burstOuter}}" fill="#FF8A3D" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
        <polygon points="{{burstInner}}" fill="#FFD23F" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </sc-if>
    <span style="position: absolute; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 64px; color: {{boomInk}}; -webkit-text-stroke: 3px #111; paint-order: stroke fill; text-shadow: 4px 4px 0 #111; transform: scale({{boomS}}) rotate(-8deg); opacity: {{boomOp}}">{{boomWord}}</span>
  </div>

  <h1 style="position: relative; margin: 0; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.2; text-align: center; text-shadow: {{tshadow}}; -webkit-text-stroke: 0; opacity: {{titleOp}}; transform: translateY({{titleY}}px)">{{title}}</h1>
  <sc-if value="{{isWin}}" hint-placeholder-val="{{ false }}">
    <span style="position: relative; font-size: 15px; font-weight: 900; text-align: center; background: #111; color: #fff; border-radius: 99px; padding: 2px 14px; opacity: {{titleOp}}">{{sub}}</span>
  </sc-if>
  <sc-if value="{{isBomb}}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; align-self: stretch; display: flex; gap: 10px; opacity: {{titleOp}}">
      <div style="flex: 1; background: #FF8A3D; color: #111; border: 3px solid #111; border-radius: 18px; box-shadow: 4px 4px 0 #111; padding: 8px 10px; display: flex; align-items: center; gap: 8px; transform: rotate(-2deg) scale({{winCardS}})">
        <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><path d="M2 19L4 6l6 6 3-9 3 9 6-6 2 13z" fill="#FFD23F" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-weight: 900; font-size: 12px">البرتقالي</span><span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px">كسب</span></span>
      </div>
      <div style="flex: 1; background: #3A2A2C; color: #fff; border: 3px solid #111; border-radius: 18px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; transform: rotate(1.5deg)">
        <span style="width: 22px; height: 22px; flex: none; border-radius: 7px; background: #4D9DFF; border: 2px solid #111; opacity: .55"></span>
        <span style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-weight: 900; font-size: 12px; opacity: .7">الأزرق</span><span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px; text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: #E2433B">خسر</span></span>
      </div>
    </div>
  </sc-if>

  <section style="position: relative; align-self: stretch; background: #fff; color: #111; border: 3px solid #111; border-radius: 20px; box-shadow: 5px 5px 0 #111; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; opacity: {{cardOp}}">
    <span style="font-size: 12px; font-weight: 900; opacity: .7">الكلمات اللي فضلت</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{left}}" as="l" hint-placeholder-count="5">
        <span style="border: 2px solid #111; border-radius: 10px; padding: 1px 10px; font-weight: 900; font-size: 13px; background: {{l.bg}}">{{l.t}}</span>
      </sc-for>
    </div>
  </section>

  <div style="margin-top: auto; align-self: stretch; display: flex; flex-direction: column; gap: 10px; position: relative">
    <button style="height: 56px; border: 3px solid #111; border-radius: 18px; background: {{btnBg}}; color: {{btnInk}}; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 {{accent}}">لوحة جديدة</button>
  </div>

  <sc-if value="{{party}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
      <sc-for list="{{confetti}}" as="c" hint-placeholder-count="18">
        <span style="position: absolute; top: -20px; left: {{c.x}}%; width: {{c.w}}px; height: {{c.h}}px; background: {{c.color}}; border: 1.5px solid #111; border-radius: 2px; animation: fall {{c.dur}}s cubic-bezier(.3, .6, .5, 1) {{c.delay}}s forwards; --r: {{c.r}}deg; --dx: {{c.dx}}px"></span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["bomb","win"],"default":"bomb"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { t: 99 };
this.raf = 0;
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
renderVals() {
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
const back = (v) => { v = clamp(v); const c = 1.7; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const t = this.state.t;
const bomb = (this.props.result ?? 'bomb') === 'bomb';
const B = 1.4; // boom moment
const pre = t < B;
const shake = bomb && t > B - 0.6 && t < B + 0.5 ? (t < B ? 2 : 9) * Math.sin(t * 80) * (t < B ? 1 : 1 - (t - B) / 0.5) : 0;
const after = clamp((t - B) / 0.8);
const bits = Array.from({ length: 10 }, (_, i) => {
const a = i / 10 * Math.PI * 2, d = 40 + 110 * ease((t - B) / 0.7);
return { x: (Math.cos(a) * d).toFixed(1), y: (Math.sin(a) * d - 9).toFixed(1), r: (i * 47 + t * 200).toFixed(0), op: t > B ? (1 - clamp((t - B - 0.6) / 0.6)).toFixed(2) : '0', color: ['#FFD23F', '#F3E6C4', '#FF8A3D', '#4D9DFF'][i % 4] };
});
const ring = (k, color) => { const p = clamp((t - B - k * 0.12) / 0.7); return { size: (60 + 220 * ease(p)).toFixed(0), op: t > B ? (1 - p).toFixed(2) : '0', color }; };
const star = (ro, ri, n, ph) => Array.from({ length: n * 2 }, (_, i) => { const a = (i / (n * 2)) * Math.PI * 2 + ph; const j = 1 + 0.12 * Math.sin(i * 2.7); const r = (i % 2 ? ri : ro * j); return (Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r).toFixed(1); }).join(' ');
const LEFT = bomb ? [['بحر', '#4D9DFF'], ['نيل', '#4D9DFF'], ['مطر', '#4D9DFF'], ['فانوس', '#FF8A3D'], ['شمس', '#FF8A3D']] : [['فانوس', '#FF8A3D'], ['شمس', '#FF8A3D'], ['عيد', '#FF8A3D']];
return {
isBomb: bomb, isWin: !bomb,
bg: bomb ? (t > B ? 'radial-gradient(circle at 50% 27%, #5A2219 0%, #2E1517 42%, #170C0E 100%)' : '#FFD23F') : '#FFD23F',
ink: bomb && t > B ? '#fff' : '#111',
tshadow: bomb && t > B ? '3px 3px 0 #000' : 'none',
burst: bomb && t > B,
burstS: back((t - B) / 0.4).toFixed(3), burstR: ((t - B) * 6).toFixed(1),
burstOuter: star(150, 104, 14, 0), burstInner: star(118, 82, 14, 0.22),
boomInk: bomb ? '#fff' : '#FFD23F',
winCardS: back((t - B - 0.6) / 0.4).toFixed(2),
embers: Array.from({ length: 14 }, (_, i) => ({ x: (i * 29 + 7) % 100, s: 3 + (i % 3) * 2, c: i % 3 ? '#FF8A3D' : '#FFD23F', d: (4 + (i % 5) * 0.9).toFixed(1), delay: ((i * 0.37) % 4).toFixed(2) })),
btnBg: bomb ? '#FFD23F' : '#111', btnInk: bomb ? '#111' : '#FFD23F',
smoke: bomb && t > B,
tag: bomb ? 'كريم قلب «توكتوك»' : 'الأزرق قلب آخر كلمة',
shakeX: shake.toFixed(1), shakeY: (shake * 0.4).toFixed(1),
flash: bomb ? (t > B && t < B + 0.35 ? (1 - (t - B) / 0.35).toFixed(2) : '0') : '0',
bombS: pre ? (1 + 0.06 * Math.sin(t * 30) * clamp(t / B)).toFixed(3) : '0', bombR: pre ? (4 * Math.sin(t * 22)).toFixed(1) : '0', bombOp: pre ? '1' : '0',
spark: (3 + 2 * Math.abs(Math.sin(t * 25))).toFixed(1),
rings: bomb ? [ring(0, '#FFD23F'), ring(1, '#FF8A3D'), ring(2, '#E2433B')] : [],
bits: bomb ? bits : [],
boomWord: bomb ? 'بوووم!' : 'كسبنا!',
boomS: (bomb ? back((t - B) / 0.45) : back((t - 0.9) / 0.45)).toFixed(2),
boomOp: (bomb ? (t > B ? 1 : 0) : clamp((t - 0.9) / 0.2) * (1 - clamp((t - 2.2) / 0.4))).toFixed(2),
winS: back((t - 0.1) / 0.6).toFixed(2),
winCards: ['بحر', 'نيل', 'شاي', 'قهوة', 'مطر', 'كحك'].map((w, i) => ({ t: w, r: ((i % 2 ? 1 : -1) * (2 + i)).toString() })),
title: bomb ? 'الأزرق قلب القنبلة' : 'الأزرق كسب اللوحة!',
sub: bomb ? 'البرتقالي كسب من غير ما يلعب حتى' : 'كشفتوا كل كلماتكم قبل البرتقالي بـ ٣ كلمات',
titleOp: clamp((t - (bomb ? B + 0.5 : 1.0)) / 0.3).toFixed(2), titleY: (12 * (1 - ease((t - (bomb ? B + 0.5 : 1.0)) / 0.4))).toFixed(1),
cardOp: clamp((t - (bomb ? B + 0.9 : 1.4)) / 0.4).toFixed(2),
left: LEFT.map(([w, c]) => ({ t: w, bg: c })),
accent: bomb ? '#FF8A3D' : '#4D9DFF',
party: !bomb && t > 0.9 && t < 6,
confetti: Array.from({ length: 18 }, (_, i) => ({ x: (i * 37) % 100, w: 7 + (i % 3) * 3, h: 10 + (i % 2) * 5, color: ['#4D9DFF', '#FFD23F', '#fff', '#3DDC97', '#FF4F9A'][i % 5], dur: (2.2 + (i % 5) * 0.35).toFixed(2), delay: ((i % 6) * 0.1).toFixed(2), r: 260 + i * 35, dx: ((i % 2 ? 1 : -1) * (15 + i * 4)) })),
play: () => {
cancelAnimationFrame(this.raf);
const t0 = performance.now();
const tick = (now) => { const tt = (now - t0) / 1000; this.setState({ t: tt }); if (tt < 6.5) this.raf = requestAnimationFrame(tick); };
this.raf = requestAnimationFrame(tick);
}
};
}
}
</script>
</body>
</html>
