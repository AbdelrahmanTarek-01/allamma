<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ارسم وخمّن · معرض الليلة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#111}a:hover{color:#333}
@keyframes cardIn{0%{transform:translateY(16px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) translateY(-4px)}}
@keyframes slideIn{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes flipIn{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),900px) rotate(var(--r))}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">

  <section style="display: flex; align-items: center; gap: 12px">
    <div style="position: relative; flex: none; animation: hop .7s ease-in-out infinite"><svg width="70" height="70" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#B48CFF" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><svg width="34" height="26" viewBox="0 0 26 22" aria-hidden="true" style="position: absolute; top: -14px; left: 18px"><path d="M2 19L4 6l6 6 3-9 3 9 6-6 2 13z" fill="#FFD23F" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
    <div style="display: flex; flex-direction: column; line-height: 1.2">
      <span style="font-size: 12.5px; font-weight: 900; background: #fff; border: 2px solid #111; border-radius: 99px; padding: 0 10px; align-self: flex-start">خلصت ٦ جولات</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 32px">سارة كسبت!</span>
      <span style="font-size: 13px; font-weight: 800">١١٢٠ نقطة · خمّنت أول واحدة ٤ مرات</span>
    </div>
  </section>

  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px">معرض الليلة</span>
    <span style="font-size: 12px; font-weight: 800">دوس على القلب للرسمة اللي عجبتك</span>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      <div style="background: #fff; border: 3px solid #111; border-radius: 18px; box-shadow: 4px 4px 0 #111; padding: 6px; display: flex; flex-direction: column; gap: 4px; transform: rotate(-2deg); animation: cardIn .35s cubic-bezier(.2,1.3,.4,1) 0.2s both">
        <div style="height: 112px; border-radius: 12px; background: #FFFDF5; display: flex; align-items: center; justify-content: center"><svg width="108" height="108" viewBox="0 0 300 300" aria-hidden="true" style="display: block;"><path d="M138 30 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0 M150 42 v14" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 56 h80 l-14 26 h-52 z" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 82 h92 l-12 120 h-68 z" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 98 h52 l-7 88 h-38 z" fill="none" stroke="#4D9DFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 172 q-14 -20 0 -42 q14 22 0 42 z" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 202 h76 l-10 22 h-56 z M150 224 v16" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 128 h-22 M238 128 h22 M80 70 l-15 -15 M220 70 l15 -15" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div style="display: flex; align-items: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#3DDC97" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><span style="font-size: 12px; font-weight: 900; flex: 1">مازن · فانوس</span>
          <button onClick="{{like0}}" aria-label="عجبتني" style="display: flex; align-items: center; gap: 3px; border: 2px solid #111; border-radius: 99px; background: {{lbg0}}; padding: 0 6px; font: 900 12px 'Cairo', sans-serif; color: #111"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z" fill="#FF4F9A" stroke="#111" stroke-width="2.4"/></svg>{{lc0}}</button>
        </div>
      </div><div style="background: #fff; border: 3px solid #111; border-radius: 18px; box-shadow: 4px 4px 0 #111; padding: 6px; display: flex; flex-direction: column; gap: 4px; transform: rotate(1.5deg); animation: cardIn .35s cubic-bezier(.2,1.3,.4,1) 0.3s both">
        <div style="height: 112px; border-radius: 12px; background: #FFFDF5; display: flex; align-items: center; justify-content: center"><svg width="108" height="108" viewBox="0 0 300 300" aria-hidden="true" style="display: block;"><path d="M90 222 Q80 140 150 140 Q220 140 210 222 Z" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M106 156 L100 108 L132 141 M168 141 L200 108 L194 156" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 176 v5 M174 176 v5" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 192 l-8 8 h16 z" fill="none" stroke="#FF4F9A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 198 h-40 M120 206 l-38 8 M180 198 h40 M180 206 l38 8" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 212 Q262 204 252 150" fill="none" stroke="#B48CFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div style="display: flex; align-items: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#B48CFF" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><span style="font-size: 12px; font-weight: 900; flex: 1">سارة · قطة</span>
          <button onClick="{{like1}}" aria-label="عجبتني" style="display: flex; align-items: center; gap: 3px; border: 2px solid #111; border-radius: 99px; background: {{lbg1}}; padding: 0 6px; font: 900 12px 'Cairo', sans-serif; color: #111"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z" fill="#FF4F9A" stroke="#111" stroke-width="2.4"/></svg>{{lc1}}</button>
        </div>
      </div><div style="background: #fff; border: 3px solid #111; border-radius: 18px; box-shadow: 4px 4px 0 #111; padding: 6px; display: flex; flex-direction: column; gap: 4px; transform: rotate(1deg); animation: cardIn .35s cubic-bezier(.2,1.3,.4,1) 0.4s both">
        <div style="height: 112px; border-radius: 12px; background: #FFFDF5; display: flex; align-items: center; justify-content: center"><svg width="108" height="108" viewBox="0 0 300 300" aria-hidden="true" style="display: block;"><path d="M90 150 h120 v56 q0 42 -60 42 q-60 0 -60 -42 z" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 165 q36 0 31 30 q-5 20 -31 14" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 132 q-12 -20 0 -40 M160 132 q-12 -20 0 -40 M190 132 q-12 -20 0 -40" fill="none" stroke="#B48CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 260 h168" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 175 h80" fill="none" stroke="#FF8A3D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div style="display: flex; align-items: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#FF4F9A" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><span style="font-size: 12px; font-weight: 900; flex: 1">نور · شاي</span>
          <button onClick="{{like2}}" aria-label="عجبتني" style="display: flex; align-items: center; gap: 3px; border: 2px solid #111; border-radius: 99px; background: {{lbg2}}; padding: 0 6px; font: 900 12px 'Cairo', sans-serif; color: #111"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z" fill="#FF4F9A" stroke="#111" stroke-width="2.4"/></svg>{{lc2}}</button>
        </div>
      </div><div style="background: #fff; border: 3px solid #111; border-radius: 18px; box-shadow: 4px 4px 0 #111; padding: 6px; display: flex; flex-direction: column; gap: 4px; transform: rotate(-1.5deg); animation: cardIn .35s cubic-bezier(.2,1.3,.4,1) 0.5s both">
        <div style="height: 112px; border-radius: 12px; background: #FFFDF5; display: flex; align-items: center; justify-content: center"><svg width="108" height="108" viewBox="0 0 300 300" aria-hidden="true" style="display: block;"><path d="M66 222 L66 142 Q66 110 108 110 L200 110 L232 170 L252 170 L252 222 Z" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M77 232 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0 M203 232 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M108 126 h62 v40 h-62 z" fill="none" stroke="#4D9DFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 190 h186" fill="none" stroke="#FF4F9A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div style="display: flex; align-items: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#FF8A3D" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><span style="font-size: 12px; font-weight: 900; flex: 1">كريم · توكتوك</span>
          <button onClick="{{like3}}" aria-label="عجبتني" style="display: flex; align-items: center; gap: 3px; border: 2px solid #111; border-radius: 99px; background: {{lbg3}}; padding: 0 6px; font: 900 12px 'Cairo', sans-serif; color: #111"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z" fill="#FF4F9A" stroke="#111" stroke-width="2.4"/></svg>{{lc3}}</button>
        </div>
      </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; background: #fff; border: 2.5px solid #111; border-radius: 16px; padding: 8px 12px; opacity: {{awOp}}">
    <span style="font-size: 12px; font-weight: 900; opacity: .7">فنان الليلة</span>
    <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 18px">{{artist}}</span>
    <span style="margin-inline-start: auto; font-size: 12px; font-weight: 800">بأكتر قلوب</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 58px; border: 3px solid #111; border-radius: 18px; background: #111; color: #FFD23F; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 23px; box-shadow: 0 6px 0 #FF4F9A">نلعبها تاني</button>
    <button style="height: 48px; border: 2.5px solid #111; border-radius: 16px; background: #fff; box-shadow: 3px 3px 0 #111; font: 900 15px 'Cairo', sans-serif">نغيّر اللعبة</button>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
    <sc-for list="{{confetti}}" as="c" hint-placeholder-count="18">
      <span style="position: absolute; top: -20px; left: {{c.x}}%; width: {{c.w}}px; height: {{c.h}}px; background: {{c.color}}; border: 1.5px solid #111; border-radius: 2px; animation: fall {{c.dur}}s cubic-bezier(.3,.6,.5,1) {{c.delay}}s forwards; --r: {{c.r}}deg; --dx: {{c.dx}}px"></span>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { likes: {} };
}
renderVals() {
const AR = (n) => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const s = this.state, BASE = [5, 3, 2, 7], NAMES = ["مازن", "سارة", "نور", "كريم"];
const cnt = BASE.map((b, i) => b + (s.likes[i] ? 1 : 0));
const top = cnt.indexOf(Math.max(...cnt));
const out = { artist: NAMES[top], awOp: '1',
confetti: Array.from({ length: 18 }, (_, i) => ({ x: (i * 37) % 100, w: 7 + (i % 3) * 3, h: 10 + (i % 2) * 5, color: ['#B48CFF', '#FFD23F', '#fff', '#FF4F9A', '#3DDC97', '#4D9DFF'][i % 6], dur: (2.2 + (i % 5) * 0.35).toFixed(2), delay: ((i % 6) * 0.1).toFixed(2), r: 260 + i * 35, dx: ((i % 2 ? 1 : -1) * (15 + i * 4)) })) };
cnt.forEach((c, i) => { out['lc' + i] = AR(c); out['lbg' + i] = s.likes[i] ? '#FFD6E7' : '#fff'; out['like' + i] = () => this.setState({ likes: Object.assign({}, s.likes, { [i]: !s.likes[i] }) }); });
return out;
}

}
</script>
</body>
</html>
