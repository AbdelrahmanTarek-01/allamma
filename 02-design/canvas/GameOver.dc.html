<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>نهاية اللعبة · كل الألعاب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#111}a:hover{color:#333}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),900px) rotate(var(--r))}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rays{to{transform:rotate(360deg)}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">
  <header style="display: flex; align-items: center; gap: 8px"><span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 900; background: #fff; border: 2px solid #111; border-radius: 99px; padding: 1px 10px 1px 4px"><span style="width: 14px; height: 14px; border-radius: 5px; border: 2px solid #111; background: {{gc}}"></span>{{gn}}</span><span style="font-size: 12.5px; font-weight: 900; background: #111; color: #FFD23F; border-radius: 99px; padding: 1px 10px">خلصت · {{doneLbl}}</span><button onClick="{{play}}" aria-label="شغّل تاني" style="margin-inline-start: auto; width: 40px; height: 40px; flex: none; border: 2.5px solid #111; border-radius: 13px; background: #fff; box-shadow: 3px 3px 0 #111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 103-6.7L3 8M3 3v5h5"/></svg></button></header>
  <h1 style="margin: 0; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.15; text-align: center; opacity: {{titleOp}}">{{winTitle}}</h1>

  <sc-if value="{{isSolo}}" hint-placeholder-val="{{ true }}">
    <section style="position: relative; display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; height: 230px">
      <div aria-hidden="true" style="position: absolute; top: -40px; left: 50%; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.5) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: rays 18s linear infinite; opacity: {{raysOp}}; -webkit-mask: radial-gradient(circle, #000 25%, transparent 65%); mask: radial-gradient(circle, #000 25%, transparent 65%)"></div>
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <sc-if value="{{p.crown}}" hint-placeholder-val="{{ false }}"><svg width="34" height="26" viewBox="0 0 26 22" aria-hidden="true" style="animation: hop 1.2s ease-in-out infinite; opacity: {{p.op}}"><path d="M2 19L4 6l6 6 3-9 3 9 6-6 2 13z" fill="#FFD23F" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/></svg></sc-if>
          <span style="display: flex; transform: scale({{p.s}}); opacity: {{p.op}}"><svg width="58" height="58" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{p.c}}" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg></span>
          <span style="font-weight: 900; font-size: 14px; opacity: {{p.op}}">{{p.n}}</span>
          <div style="align-self: stretch; height: {{p.h}}px; background: {{p.bg}}; border: 3px solid #111; border-bottom: 0; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; align-items: center; padding-top: 4px; overflow: hidden">
            <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1">{{p.rank}}</span>
            <span style="font-size: 12px; font-weight: 900">{{p.pts}}</span>
          </div>
        </div>
      </sc-for>
    </section>
  </sc-if>
  <sc-if value="{{isTeam}}" hint-placeholder-val="{{ false }}">
    <section style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px">
      <div aria-hidden="true" style="position: absolute; top: -50px; left: 50%; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.5) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: rays 18s linear infinite; opacity: {{raysOp}}; -webkit-mask: radial-gradient(circle, #000 25%, transparent 65%); mask: radial-gradient(circle, #000 25%, transparent 65%)"></div>
      <svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true" style="position: relative; transform: scale({{cupS}})"><path d="M18 8h28v14a14 14 0 01-28 0z" fill="#FFD23F" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M18 12H9a8 8 0 008 10M46 12h9a8 8 0 01-8 10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/><path d="M28 36h8v8h-8z" fill="#FF8A3D" stroke="#111" stroke-width="3"/><path d="M20 44h24v8H20z" fill="{{gc}}" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>
      <span style="position: relative; display: flex; gap: 6px; opacity: {{titleOp}}"><svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="flex: none; animation: hop .6s ease-in-out infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#FF8A3D" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="flex: none; animation: hop .6s ease-in-out .15s infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#B48CFF" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg><svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="flex: none; animation: hop .6s ease-in-out .3s infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#FFD23F" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg></span>
      <span style="position: relative; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px; background: #fff; border: 3px solid #111; border-radius: 16px; padding: 2px 18px; opacity: {{titleOp}}">{{teamScore}}</span>
    </section>
  </sc-if>

  <sc-if value="{{isSolo}}" hint-placeholder-val="{{ true }}">
    <div style="display: grid; grid-template-columns: 1fr 1fr; margin-top: -12px; background: #fff; border: 3px solid #111; border-radius: 0 0 18px 18px; overflow: hidden; opacity: {{restOp}}">
      <sc-for list="{{rest}}" as="r" hint-placeholder-count="2">
        <span style="display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-left: {{r.sep}}">
          <span style="width: 24px; height: 24px; flex: none; border-radius: 50%; background: #111; color: #FFD23F; display: flex; align-items: center; justify-content: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 13px">{{r.rank}}</span>
          <svg width="28" height="28" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{r.c}}" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/></svg>
          <span style="display: flex; flex-direction: column; line-height: 1.15; min-width: 0"><span style="font-weight: 900; font-size: 13.5px">{{r.n}}</span><span style="font-size: 11.5px; font-weight: 800; opacity: .7">{{r.pts}}</span></span>
        </span>
      </sc-for>
    </div>
  </sc-if>

  <section style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; opacity: {{awOp}}; transform: translateY({{awY}}px)">
    <sc-for list="{{awards}}" as="a" hint-placeholder-count="2">
      <div style="background: #fff; border: 3px solid #111; border-radius: 18px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; border: 2px solid #111; background: {{gc}}"></span><span style="font-size: 11.5px; font-weight: 900; opacity: .75">{{a.k}}</span></span>
        <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 19px">{{a.who}}</span>
        <span style="font-size: 11.5px; font-weight: 800">{{a.why}}</span>
      </div>
    </sc-for>
  </section>

  <div style="display: flex; align-items: center; gap: 8px; background: #111; color: #fff; border-radius: 16px; padding: 8px 12px; opacity: {{awOp}}">
    <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28v14a14 14 0 01-28 0z" fill="#FFD23F" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M27 36h10v8H27zM20 44h24v10H20z" fill="#FFD23F"/></svg>
    <span style="font-size: 12.5px; font-weight: 800">{{roomLine}}</span>
    <span style="margin-inline-start: auto; font-size: 12.5px; font-weight: 900; color: #FFD23F; text-decoration: underline">ترتيب القعدة</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button onClick="{{play}}" style="height: 58px; border: 3px solid #111; border-radius: 18px; background: #111; color: #FFD23F; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 23px; box-shadow: 0 6px 0 {{gc}}">نلعبها تاني</button>
    <button style="height: 48px; border: 2.5px solid #111; border-radius: 16px; background: #fff; box-shadow: 3px 3px 0 #111; font: 900 15px 'Cairo', sans-serif">نغيّر اللعبة</button>
  </div>

  <sc-if value="{{party}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
      <sc-for list="{{confetti}}" as="c" hint-placeholder-count="20">
        <span style="position: absolute; top: -20px; left: {{c.x}}%; width: {{c.w}}px; height: {{c.h}}px; background: {{c.color}}; border: 1.5px solid #111; border-radius: 2px; animation: fall {{c.dur}}s cubic-bezier(.3,.6,.5,1) {{c.delay}}s forwards; --r: {{c.r}}deg; --dx: {{c.dx}}px"></span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"game": {"editor": "enum", "options": ["spy", "geo", "wave", "quiz", "words", "auction", "draw"], "default": "spy"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { t: 99 };
this.raf = 0;
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
renderVals() {
const GAMES = {"spy": {"n": "مين الجاسوس؟", "c": "#FF4F9A", "team": false, "unit": "نقطة", "hl": "الجولة دي: الجاسوس كان كريم · سارة مسكته", "aw": [["أشطر محقق", "سارة", "مسكت الجاسوس ٣ مرات"], ["أحسن جاسوس", "كريم", "هرب مرتين وخمّن المكان"]]}, "geo": {"n": "فين دي؟", "c": "#3DDC97", "team": false, "unit": "نقطة", "hl": "الجولة دي: أقرب دبوس لمازن · ١٢ كم بس", "aw": [["عين الصقر", "مازن", "متوسط بُعده ٤٠ كم"], ["التايه", "نور", "حطّت أسوان في إسكندرية"]]}, "wave": {"n": "الموجة", "c": "#4D9DFF", "team": false, "unit": "نقطة", "hl": "الجولة دي: سارة جابتها في النص بالظبط", "aw": [["قارئ الأفكار", "سارة", "٣ مرات في النص بالظبط"], ["أحسن راوي", "إنت", "الكل قرّب من تلميحك"]]}, "quiz": {"n": "حزّورة", "c": "#B48CFF", "team": true, "unit": "نقطة", "hl": "الجولة دي: البرتقالي سرق سؤال الـ ٦٠٠", "aw": [["نجم الماتش", "سارة", "جاوبت ٦ صح من ٧"], ["أحلى لحظة", "سرقة الـ ٦٠٠", "في آخر ٣ ثواني"]]}, "words": {"n": "شبكة الكلمات", "c": "#3DDC97", "team": true, "unit": "لوحة", "hl": "اللوحة دي: الأزرق قلب القنبلة", "aw": [["أحسن دليل", "مازن", "«مية · ٤» وجابوها كلها"], ["ضحية القنبلة", "كريم", "قلب «توكتوك»"]]}, "auction": {"n": "مزاد المعلومات", "c": "#FF8A3D", "team": false, "unit": "ج", "hl": "المعلومة دي: مازن اشترى بـ ٤٠٠ وجاوب صح", "aw": [["أغلى معلومة", "مازن", "اشترى بـ ٧٠٠ وجابها"], ["أشجع مزايد", "كريم", "زايد بكل فلوسه مرتين"]]}, "draw": {"n": "ارسم وخمّن", "c": "#FFD23F", "team": false, "unit": "نقطة", "hl": "الجولة دي: «فانوس» · ٣ من ٤ خمّنوها", "aw": [["فنان الليلة", "مازن", "أكتر قلوب في المعرض"], ["أسرع إيد", "سارة", "خمّنت أول واحدة ٤ مرات"]]}};
const AR = (n) => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
const back = (v) => { v = clamp(v); const c = 1.7; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const g = GAMES[this.props.game ?? 'spy'] || GAMES.spy, t = this.state.t;
const scale = g.unit === 'ج' ? 30 : 10;
const P = [['سارة', '#B48CFF', 49], ['مازن', '#3DDC97', 50], ['إنت', '#4D9DFF', 44], ['نور', '#FF4F9A', 27], ['كريم', '#FF8A3D', 25]].sort((a, b) => b[2] - a[2]);
const fmt = (v) => AR(Math.round(v * scale)) + (g.unit === 'ج' ? ' ج' : '');
const order = [1, 0, 2];
const rise = (i) => ease((t - 0.3 - (2 - i) * 0.35) / 0.5);
return {
gn: g.n, gc: g.c, isTeam: g.team, isSolo: !g.team,
doneLbl: g.unit === 'لوحة' ? '٣ لوحات' : g.n === 'مزاد المعلومات' ? '٨ معلومات' : '٦ جولات',
winTitle: g.team ? 'البرتقالي كسب الماتش!' : P[0][0] + ' كسب اللعبة!',
titleOp: clamp((t - 1.5) / 0.3).toFixed(2),
podium: order.map(i => ({ n: P[i][0], c: P[i][1], rank: AR(i + 1), pts: fmt(P[i][2]), crown: i === 0, bg: ['#FFD23F', '#fff', '#F3E6C4'][i], h: Math.round([110, 84, 64][i] * (0.25 + 0.75 * rise(i))), s: back((t - 0.5 - (2 - i) * 0.35) / 0.4).toFixed(2), op: clamp((t - 0.4 - (2 - i) * 0.35) / 0.2).toFixed(2) })),
rest: P.slice(3).map((p, i) => ({ n: p[0], c: p[1], rank: AR(i + 4), pts: fmt(p[2]) + (g.unit === 'ج' ? '' : ' نقطة'), sep: i === 0 ? '2px solid rgba(17,17,17,.12)' : '0' })), restOp: clamp((t - 1.7) / 0.3).toFixed(2),
cupS: back((t - 0.3) / 0.6).toFixed(2), teamScore: g.unit === 'لوحة' ? '٢ – ١ في اللوحات' : '٤٬٢٠٠ – ٣٬٦٠٠',
raysOp: clamp((t - 1.3) / 0.5).toFixed(2),
awards: g.aw.map(a => ({ k: a[0], who: a[1], why: a[2] })), awOp: clamp((t - 2) / 0.4).toFixed(2), awY: (14 * (1 - ease((t - 2) / 0.5))).toFixed(1),
roomLine: g.team ? 'كل واحد في الفريق الكسبان خد +٨ في ترتيب القعدة' : P[0][0] + ' خد +١٠ في ترتيب القعدة',
party: t > 1.4 && t < 7,
confetti: Array.from({ length: 20 }, (_, i) => ({ x: (i * 41) % 100, w: 7 + (i % 3) * 3, h: 10 + (i % 2) * 5, color: [g.c, '#fff', '#FF4F9A', '#4D9DFF', '#3DDC97', '#FF8A3D'][i % 6], dur: (2.2 + (i % 5) * 0.35).toFixed(2), delay: ((i % 7) * 0.1).toFixed(2), r: 260 + i * 35, dx: ((i % 2 ? 1 : -1) * (15 + i * 4)) })),
play: () => { cancelAnimationFrame(this.raf); const t0 = performance.now(); const tick = (now) => { const tt = (now - t0) / 1000; this.setState({ t: tt }); if (tt < 9) this.raf = requestAnimationFrame(tick); }; this.raf = requestAnimationFrame(tick); },
};
}
}
</script>
</body>
</html>
