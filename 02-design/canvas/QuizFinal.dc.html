<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حزّورة · الفوز</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#111}a:hover{color:#333}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),900px) rotate(var(--r))}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes rays{to{transform:rotate(360deg)}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">

  <section style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px">
    <div aria-hidden="true" style="position: absolute; top: -70px; left: 50%; width: 380px; height: 380px; margin-left: -190px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.45) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: rays 18s linear infinite; opacity: {{raysOp}}; -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%)"></div>
    <svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true" style="position: relative; transform: scale({{cupS}}) rotate({{cupR}}deg)">
      <path d="M18 8h28v14a14 14 0 01-28 0z" fill="#FFD23F" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M18 12H9a8 8 0 008 10M46 12h9a8 8 0 01-8 10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 36h8v8h-8z" fill="#FF8A3D" stroke="#111" stroke-width="3"/>
      <path d="M20 44h24v8H20z" fill="#4D9DFF" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M26 16l2 4 4 .6-3 3 .7 4.4-3.7-2-3.7 2 .7-4.4-3-3 4-.6z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span style="position: relative; font-size: 13px; font-weight: 900; background: #fff; border: 2px solid #111; border-radius: 99px; padding: 0 12px; opacity: {{titleOp}}">خلصت اللوحة</span>
    <h1 style="position: relative; margin: 0; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.15; text-align: center; opacity: {{titleOp}}; transform: translateY({{titleY}}px)">الفريق البرتقالي كسب!</h1>
    <div style="position: relative; display: flex; gap: 6px; margin-top: 4px; opacity: {{titleOp}}">
      <svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="animation: hop .6s ease-in-out infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#3DDC97" stroke="#111" stroke-width="3"/><rect x="13" y="25" width="13" height="9" rx="3" fill="#111"/><rect x="30" y="25" width="13" height="9" rx="3" fill="#111"/><path d="M21 39q7 8 14 0z" fill="#111"/></svg>
      <svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="animation: hop .6s ease-in-out .15s infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#B48CFF" stroke="#111" stroke-width="3"/><path d="M28 12L17 5v13zM28 12l11-7v13z" fill="#FFD23F" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/><path d="M23 39q5 5 10 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg>
      <svg width="46" height="46" viewBox="0 0 56 56" aria-hidden="true" style="animation: hop .6s ease-in-out .3s infinite"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#FF8A3D" stroke="#111" stroke-width="3"/><path d="M7 31a21 21 0 0142 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/><rect x="3" y="25" width="9" height="14" rx="3.5" fill="#111"/><rect x="44" y="25" width="9" height="14" rx="3.5" fill="#111"/><path d="M17 31q4-4 8 0M31 31q4-4 8 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/><path d="M23 39q5 5 10 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
  </section>

  <section style="background: #fff; border: 3px solid #111; border-radius: 22px; box-shadow: 5px 5px 0 #111; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center">
      <span style="font-weight: 900; font-size: 14px">البرتقالي</span>
      <span style="height: 22px; border: 2.5px solid #111; border-radius: 99px; overflow: hidden; display: flex; background: #f3ecd0"><span style="width: {{bW}}%; background: #FF8A3D; border-left: 2.5px solid #111"></span></span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px; text-align: left; font-variant-numeric: tabular-nums">{{bScore}}</span>
    </div>
    <div style="display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center">
      <span style="font-weight: 900; font-size: 14px">الأزرق</span>
      <span style="height: 22px; border: 2.5px solid #111; border-radius: 99px; overflow: hidden; display: flex; background: #f3ecd0"><span style="width: {{aW}}%; background: #4D9DFF; border-left: 2.5px solid #111"></span></span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px; text-align: left; font-variant-numeric: tabular-nums">{{aScore}}</span>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; opacity: {{statsOp}}; transform: translateY({{statsY}}px)">
    <div style="background: #fff; border: 3px solid #111; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11.5px; font-weight: 900; opacity: .7">نجم اللوحة</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px">سارة</span>
      <span style="font-size: 12px; font-weight: 800">جاوبت ٦ صح من ٧</span>
    </div>
    <div style="background: #fff; border: 3px solid #111; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11.5px; font-weight: 900; opacity: .7">أحلى لحظة</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 20px">سرقة الـ ٦٠٠</span>
      <span style="font-size: 12px; font-weight: 800">في آخر ٣ ثواني</span>
    </div>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button onClick="{{play}}" style="height: 58px; border: 3px solid #111; border-radius: 18px; background: #111; color: #FFD23F; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 23px; box-shadow: 0 6px 0 #FF8A3D">نلعبها تاني</button>
    <button style="height: 48px; border: 2.5px solid #111; border-radius: 16px; background: #fff; box-shadow: 3px 3px 0 #111; font: 900 15px 'Cairo', sans-serif">نغيّر اللعبة</button>
  </div>

  <sc-if value="{{party}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
      <sc-for list="{{confetti}}" as="c" hint-placeholder-count="22">
        <span style="position: absolute; top: -20px; left: {{c.x}}%; width: {{c.w}}px; height: {{c.h}}px; background: {{c.color}}; border: 1.5px solid #111; border-radius: 2px; animation: fall {{c.dur}}s cubic-bezier(.3, .6, .5, 1) {{c.delay}}s forwards; --r: {{c.r}}deg; --dx: {{c.dx}}px"></span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { t: 99 };
this.raf = 0;
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
renderVals() {
const AR = (n) => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const fmt = (n) => AR(String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','));
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
const back = (v) => { v = clamp(v); const c = 1.7; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const t = this.state.t;
const race = ease((t - 0.2) / 1.6);
const A = 3600, B = 4200, M = 4200;
const a = Math.round(A * race / 10) * 10, b = Math.round(B * race / 10) * 10;
const win = t > 1.9;
return {
aScore: fmt(a).replace(/,/g, '٬'), bScore: fmt(b).replace(/,/g, '٬'),
aW: (a / M * 100).toFixed(1), bW: (b / M * 100).toFixed(1),
cupS: (0.3 + 0.7 * back((t - 1.8) / 0.6)).toFixed(2), cupR: (-20 * (1 - clamp((t - 1.8) / 0.7))).toFixed(1),
raysOp: clamp((t - 2) / 0.5).toFixed(2),
titleOp: clamp((t - 2.1) / 0.3).toFixed(2), titleY: (12 * (1 - ease((t - 2.1) / 0.4))).toFixed(1),
statsOp: clamp((t - 2.6) / 0.4).toFixed(2), statsY: (14 * (1 - ease((t - 2.6) / 0.5))).toFixed(1),
party: win && t < 7,
confetti: Array.from({ length: 22 }, (_, i) => ({ x: (i * 41) % 100, w: 7 + (i % 3) * 3, h: 10 + (i % 2) * 5, color: ['#FF8A3D', '#FFD23F', '#fff', '#4D9DFF', '#FF4F9A', '#3DDC97'][i % 6], dur: (2.2 + (i % 5) * 0.35).toFixed(2), delay: ((i % 7) * 0.1).toFixed(2), r: 260 + i * 35, dx: ((i % 2 ? 1 : -1) * (15 + i * 4)) })),
play: () => {
cancelAnimationFrame(this.raf);
const t0 = performance.now();
const tick = (now) => { const tt = (now - t0) / 1000; this.setState({ t: tt }); if (tt < 7.2) this.raf = requestAnimationFrame(tick); };
this.raf = requestAnimationFrame(tick);
}
};
}
}
</script>
</body>
</html>
