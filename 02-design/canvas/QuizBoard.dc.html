<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حزّورة · اللوحة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#111}a:hover{color:#333}
@keyframes pick{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1.08)}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">

  <section style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch">
    <div style="background: #4D9DFF; border: 3px solid #111; border-radius: 18px; padding: 6px 10px; display: flex; flex-direction: column; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #111">
      <span style="font-size: 12px; font-weight: 900">الأزرق · دوركم</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums">١٬٤٠٠</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <span style="font-size: 11px; font-weight: 900">فاضل</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px; line-height: 1">{{left}}</span>
    </div>
    <div style="background: #fff; border: 3px solid #111; border-radius: 18px; padding: 6px 10px; display: flex; flex-direction: column">
      <span style="font-size: 12px; font-weight: 900">البرتقالي</span>
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums">١٬٠٠٠</span>
    </div>
  </section>

  <div style="display: flex; align-items: center; gap: 8px">
    <svg width="34" height="34" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="#4D9DFF" stroke="#111" stroke-width="3.5"/><path d="M20 14l2-10h12l2 10z" fill="#FF4F9A" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="22" cy="31" r="2.3" fill="#111"/><circle cx="36" cy="31" r="2.3" fill="#111"/></svg>
    <span style="flex: 1; font-size: 14px; font-weight: 800">{{turnText}}</span>
  </div>

  <section style="background: #fff; border: 3px solid #111; border-radius: 22px; box-shadow: 5px 5px 0 #111; padding: 10px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: 96px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end">
      <span style="font-size: 11px; font-weight: 900; opacity: .7">الفئة</span>
      <span style="text-align: center; font-size: 11.5px; font-weight: 900">سهل</span>
      <span style="text-align: center; font-size: 11.5px; font-weight: 900">متوسط</span>
      <span style="text-align: center; font-size: 11.5px; font-weight: 900">صعب</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 96px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center">
        <div style="display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-weight: 900; font-size: 13.5px">{{r.name}}</span>
          <span style="width: 22px; height: 4px; border-radius: 99px; background: {{r.owner}}; margin-top: 3px"></span>
        </div>
        <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3">
          <button onClick="{{c.pick}}" disabled="{{c.used}}" style="height: 54px; border: 2.5px solid #111; border-radius: 12px; background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.shadow}}; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: {{c.fs}}; animation: {{c.anim}}; transition: transform .12s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">{{c.label}}<span style="font-family: 'Cairo', sans-serif; font-size: 10px; font-weight: 900; margin-top: 2px; opacity: {{c.unitOp}}">نقطة</span></button>
        </sc-for>
      </div>
    </sc-for>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 900">كروت فريقكم</span><span style="font-size: 11px; font-weight: 800">كل كارت مرة واحدة في اللعبة</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="position: relative; min-height: 84px; border: 2.5px solid #111; border-radius: 14px; background: #fff; box-shadow: 3px 3px 0 #111; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: 'Cairo', sans-serif; color: #111; opacity: 1; transform: rotate(-2deg)">
        <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1">×٢</span>
        <span style="font-size: 12px; font-weight: 900">دبّل</span>
        <span style="font-size: 10.5px; font-weight: 700; line-height: 1.3; text-align: center; opacity: .8">نقط السؤال الجاي بالضعف</span>
      </button>
      <button style="position: relative; min-height: 84px; border: 2.5px solid #111; border-radius: 14px; background: #fff; box-shadow: 3px 3px 0 #111; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: 'Cairo', sans-serif; color: #111; opacity: 1; transform: rotate(1.5deg)">
        <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1">٥٠:٥٠</span>
        <span style="font-size: 12px; font-weight: 900">شيل إجابتين</span>
        <span style="font-size: 10.5px; font-weight: 700; line-height: 1.3; text-align: center; opacity: .8">يتشال اختيارين غلط</span>
      </button>
      <button style="position: relative; min-height: 84px; border: 2.5px solid #111; border-radius: 14px; background: #f3ecd0; box-shadow: none; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: 'Cairo', sans-serif; color: #111; opacity: .5; transform: rotate(-1deg)">
        <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1">✓</span>
        <span style="font-size: 12px; font-weight: 900">سرقة</span>
        <span style="font-size: 10.5px; font-weight: 700; line-height: 1.3; text-align: center; opacity: .8">اتلعب خلاص</span>
      </button>
    </div>
  </section>

  <span style="margin-top: auto; text-align: center; font-size: 12px; font-weight: 800">فيه كنز ×٢ وقنبلة مستخبيين في اللوحة، محدش يعرف فين</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: null };
}
renderVals() {
const AR = (n) => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const CATS = [['كورة مصرية', 'a'], ['أفلام زمان', 'b'], ['أكل مصري', 'a'], ['أغاني', 'b'], ['جغرافيا', 'a'], ['كمّل المثل', 'b']];
const USED = { '0-0': 'a', '1-0': 'b', '2-1': 'a', '3-0': 'b', '4-0': 'x', '5-1': 'a', '0-1': 'b' };
const VALS = [200, 400, 600];
const s = this.state;
const count = 18 - Object.keys(USED).length;
return {
left: AR(count),
turnText: s.picked ? 'عبدالرحمن اختار… استعدوا!' : 'دور عبدالرحمن يختار خانة لفريقه',
rows: CATS.map(([name, owner], r) => ({
name, owner: owner === 'a' ? '#4D9DFF' : '#FF8A3D',
cells: VALS.map((v, c) => {
const id = r + '-' + c, u = USED[id], isPick = s.picked === id;
return {
used: !!u,
label: u === 'x' ? '—' : AR(v),
fs: u ? '16px' : '20px',
unitOp: u ? '0' : '.75',
bg: isPick ? '#111' : u === 'a' ? '#4D9DFF' : u === 'b' ? '#FF8A3D' : u === 'x' ? '#eee' : '#FFD23F',
fg: isPick ? '#FFD23F' : u ? 'rgba(17,17,17,.55)' : '#111',
shadow: u ? 'none' : '3px 3px 0 #111',
anim: isPick ? 'pick .4s cubic-bezier(.2, 1.4, .4, 1) forwards' : 'none',
pick: () => { if (!u) this.setState({ picked: isPick ? null : id }); }
};
})
}))
};
}
}
</script>
</body>
</html>
