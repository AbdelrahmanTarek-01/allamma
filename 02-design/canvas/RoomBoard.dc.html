<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ترتيب القعدة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;overflow:hidden}
a{color:#111}a:hover{color:#333}
.tabs::-webkit-scrollbar{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; color: #111; background: #FFD23F">

  <header style="display: flex; align-items: center; gap: 10px">
    <button aria-label="رجوع" style="width: 40px; height: 40px; flex: none; border: 2.5px solid #111; border-radius: 13px; background: #fff; box-shadow: 3px 3px 0 #111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div style="display: flex; flex-direction: column; line-height: 1.2">
      <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 24px">ترتيب القعدة</span>
      <span style="font-size: 12px; font-weight: 800">قعدة الخميس · {{played}} ألعاب · من ساعة و١٠ دقايق</span>
    </div>
    <button onClick="{{play}}" aria-label="شغّل التحديث" style="margin-inline-start: auto; width: 40px; height: 40px; flex: none; border: 2.5px solid #111; border-radius: 13px; background: #fff; box-shadow: 3px 3px 0 #111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 103-6.7L3 8M3 3v5h5"/></svg></button>
  </header>

  <div class="tabs" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none">
    <sc-for list="{{tabs}}" as="g" hint-placeholder-count="5">
      <button onClick="{{g.pick}}" style="flex: none; height: 34px; padding: 0 12px; border: 2.5px solid #111; border-radius: 99px; background: {{g.bg}}; color: {{g.ink}}; box-shadow: {{g.shadow}}; font: 900 13px 'Cairo', sans-serif; display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 3px; border: 1.8px solid {{g.ink}}; background: {{g.dot}}"></span>{{g.name}}</button>
    </sc-for>
  </div>

  <section style="display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; height: 186px">
    <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <sc-if value="{{p.crown}}" hint-placeholder-val="{{ false }}">
          <svg width="30" height="22" viewBox="0 0 26 22" aria-hidden="true" style="animation: bob 1.4s ease-in-out infinite"><path d="M2 19L4 6l6 6 3-9 3 9 6-6 2 13z" fill="#FFD23F" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/></svg>
        </sc-if>
        <svg width="{{p.sz}}" height="{{p.sz}}" viewBox="0 0 56 56" aria-hidden="true"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{p.c}}" stroke="#111" stroke-width="3"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="21" cy="31" r="2.3" fill="#111"/><circle cx="35" cy="31" r="2.3" fill="#111"/><path d="M23 39q5 5 10 0" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span style="font-weight: 900; font-size: 14px; line-height: 1">{{p.name}}</span>
        <div style="align-self: stretch; height: {{p.h}}px; background: {{p.bg}}; border: 3px solid #111; border-bottom: 0; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; align-items: center; padding-top: 4px">
          <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1">{{p.rank}}</span>
          <span style="font-size: 12.5px; font-weight: 900">{{p.pts}} نقطة</span>
        </div>
      </div>
    </sc-for>
  </section>

  <section style="position: relative; margin-top: -10px; background: #fff; border: 3px solid #111; border-radius: 20px; box-shadow: 5px 5px 0 #111; padding: 6px 10px; height: {{listH}}px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="position: absolute; left: 10px; right: 10px; top: {{r.top}}px; height: 44px; display: flex; align-items: center; gap: 8px; border-bottom: {{r.line}}">
        <span style="width: 22px; text-align: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 17px">{{r.rank}}</span>
        <svg width="30" height="30" viewBox="0 0 56 56" aria-hidden="true" style="flex: none"><path d="M8 32C8 18 17 10 28 10s20 8 20 22-9 20-20 20S8 46 8 32z" fill="{{r.c}}" stroke="#111" stroke-width="3.5"/><circle cx="21" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="35" cy="30" r="5" fill="#fff" stroke="#111" stroke-width="3"/></svg>
        <span style="font-weight: 900; font-size: 14px">{{r.name}}</span>
        <span style="font-size: 11px; font-weight: 900; color: {{r.mvC}}; opacity: {{r.mvOp}}">{{r.mv}}</span>
        <span style="margin-inline-start: auto; display: flex; gap: 3px">
          <sc-for list="{{r.games}}" as="g" hint-placeholder-count="4"><span style="width: 8px; height: {{g.h}}px; border-radius: 3px; border: 1.5px solid #111; background: {{g.c}}; align-self: flex-end"></span></sc-for>
        </span>
        <span style="width: 44px; text-align: left; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums">{{r.pts}}</span>
      </div>
    </sc-for>
  </section>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 900">الألعاب اللي اتلعبت</span>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{history}}" as="h" hint-placeholder-count="5">
        <span style="font-size: 11.5px; font-weight: 900; background: #fff; border: 2px solid #111; border-radius: 99px; padding: 0 8px; display: flex; align-items: center; gap: 4px; opacity: {{h.op}}"><span style="width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid #111; background: {{h.c}}"></span>{{h.t}}</span>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 11.5px; font-weight: 800; text-align: center; opacity: .8">كل لعبة بتدّي نقط بالمركز: الأول ١٠ · التاني ٧ · التالت ٥ · الباقي ٢ · في الفرق الكسبانين ياخدوا ٨</span>
    <button style="height: 58px; border: 3px solid #111; border-radius: 18px; background: #111; color: #FFD23F; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-weight: 800; font-size: 22px; box-shadow: 0 6px 0 #4D9DFF">اختار اللعبة الجاية</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { t: 99, tab: 0 };
this.raf = 0;
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
renderVals() {
const AR = (n) => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
const t = this.state.t, tab = this.state.tab;
const GAMES = [['مين الجاسوس؟', '#FF4F9A'], ['فين دي؟', '#3DDC97'], ['حزّورة', '#4D9DFF'], ['شبكة الكلمات', '#FF8A3D']];
// points per game type [spy, geo, quiz, words]; last = points from the newest game (words)
const P = [
['سارة', '#B48CFF', [10, 7, 8, 8]], ['مازن', '#3DDC97', [7, 10, 8, 8]], ['كريم', '#FF8A3D', [12, 5, 2, 2]], ['يوسف', '#4D9DFF', [5, 2, 8, 8]],
['نور', '#FF4F9A', [2, 7, 2, 8]], ['عمر', '#FFD23F', [9, 2, 8, 2]], ['ليلى', '#fff', [2, 5, 2, 2]], ['أحمد', '#9ADFFF', [2, 2, 2, 2]]
];
const LAST = 3;
const score = (p, upto) => tab === 0 ? p[2].reduce((a, v, i) => a + (upto || i !== LAST ? v : 0), 0) : p[2][tab - 1];
const before = P.map(p => ({ p, s: score(p, false) })).sort((a, b) => b.s - a.s).map(x => x.p[0]);
const after = P.map(p => ({ p, s: score(p, true) })).sort((a, b) => b.s - a.s);
const k = tab === 0 ? ease((t - 0.3) / 1.1) : 1;
const RH = 44;
const shown = after.slice(3);
const rows = shown.map((x, i) => {
const newI = i + 3, oldI = before.indexOf(x.p[0]);
const fromTop = Math.min(oldI, 8) - 3;
const top = 6 + RH * (fromTop + (i - fromTop) * k);
const mv = tab === 0 ? oldI - newI : 0;
const sNow = Math.round(score(x.p, false) + (x.s - score(x.p, false)) * k);
const mx = Math.max(...x.p[2]);
return { rank: AR(newI + 1), name: x.p[0], c: x.p[1], pts: AR(tab === 0 ? sNow : x.s), top: top.toFixed(1), line: i < shown.length - 1 ? '2px solid rgba(17,17,17,.08)' : '0',
mv: mv > 0 ? '▲' + AR(mv) : mv < 0 ? '▼' + AR(-mv) : '', mvC: mv > 0 ? '#1F9E6A' : '#E2433B', mvOp: clamp((t - 1.2) / 0.3).toFixed(2),
games: x.p[2].map((v, gi) => ({ h: Math.round(6 + 14 * v / 12), c: tab === 0 || tab - 1 === gi ? GAMES[gi][1] : '#eee' })) };
});
const top3 = after.slice(0, 3);
const order = [1, 0, 2];
return {
played: AR(5),
tabs: [['الكل', '#111']].concat(GAMES).map((g, i) => ({ name: g[0], dot: i === 0 ? '#FFD23F' : g[1], bg: tab === i ? '#111' : '#fff', ink: tab === i ? '#FFD23F' : '#111', shadow: tab === i ? 'none' : '2px 2px 0 #111', pick: () => this.setState({ tab: i }) })),
podium: order.map(i => { const x = top3[i]; const pop = tab === 0 ? ease((t - 1.3 - i * 0.12) / 0.5) : 1; return { name: x.p[0], c: x.p[1], pts: AR(x.s), rank: AR(i + 1), crown: i === 0, sz: i === 0 ? 62 : 50, h: Math.round([92, 70, 54][i] * (0.3 + 0.7 * pop)), bg: ['#FFD23F', '#fff', '#F3E6C4'][i] }; }),
rows, listH: 12 + RH * shown.length,
history: [['الجاسوس · سارة', '#FF4F9A'], ['فين دي؟ · مازن', '#3DDC97'], ['حزّورة · البرتقالي', '#4D9DFF'], ['الجاسوس · كريم', '#FF4F9A'], ['شبكة الكلمات · البرتقالي', '#FF8A3D']].map((h, i) => ({ t: h[0], c: h[1], op: i === 4 ? clamp((t - 0.1) / 0.3).toFixed(2) : '1' })),
play: () => {
cancelAnimationFrame(this.raf);
this.setState({ tab: 0 });
const t0 = performance.now();
const tick = (now) => { const tt = (now - t0) / 1000; this.setState({ t: tt }); if (tt < 2.5) this.raf = requestAnimationFrame(tick); };
this.raf = requestAnimationFrame(tick);
}
};
}
}
</script>
</body>
</html>
