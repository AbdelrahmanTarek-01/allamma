      </section>

        <div style="display: flex; gap: 8px"><button onClick="{{theme0}}" style="flex: 1; min-width: 0; height: 46px; border: 2.5px solid #111; border-radius: 14px; background: {{themebg0}}; color: {{themeink0}}; box-shadow: {{themesh0}}; font: 900 15px 'Cairo', sans-serif; white-space: nowrap; transition: transform .1s; transform: {{themetr0}}">مدن</button><button onClick="{{theme1}}" style="flex: 1; min-width: 0; height: 46px; border: 2.5px solid #111; border-radius: 14px; background: {{themebg1}}; color: {{themeink1}}; box-shadow: {{themesh1}}; font: 900 15px 'Cairo', sans-serif; white-space: nowrap; transition: transform .1s; transform: {{themetr1}}">معالم</button><button onClick="{{theme2}}" style="flex: 1; min-width: 0; height: 46px; border: 2.5px solid #111; border-radius: 14px; background: {{themebg2}}; color: {{themeink2}}; box-shadow: {{themesh2}}; font: 900 15px 'Cairo', sans-serif; white-space: nowrap; transition: transform .1s; transform: {{themetr2}}">ملاعب</button><button onClick="{{theme3}}" style="flex: 1; min-width: 0; height: 46px; border: 2.5px solid #111; border-radius: 14px; background: {{themebg3}}; color: {{themeink3}}; box-shadow: {{themesh3}}; font: 900 15px 'Cairo', sans-serif; white-space: nowrap; transition: transform .1s; transform: {{themetr3}}">أكلات</button><button onClick="{{theme4}}" aria-label="عشوائي" style="flex: none; width: 54px; height: 46px; border: 2.5px dashed #111; border-radius: 14px; background: {{themebg4}}; color: {{themeink4}}; box-shadow: {{themesh4}}; transform: {{themetr4}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="18" height="18" rx="5" fill="transparent" stroke="currentColor" stroke-width="2.2"/><circle cx="8.5" cy="8.5" r="1.7" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/></svg></button></div>

      </section>
      <section style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 2px solid rgba(17,17,17,.08)">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { map: 2, theme: 0, places: 0, secs: 1, lv: 1 }; }
renderVals() {
const s = this.state, o = {};
const SEC = {"map": [4, {"0": "مصر بس", "1": "كل الدول العربية", "2": "أي حتة في العالم", "3": "كل مكان من خريطة شكل"}], "theme": [5, {"0": "المدن والعواصم", "1": "أماكن مشهورة", "2": "ملاعب الكورة", "3": "الأكلة دي جاية منين", "4": "كل مكان من نوع شكل"}], "places": [3, null], "secs": [3, null]};
for (const k in SEC) { const [n, help] = SEC[k]; for (let i = 0; i < n; i++) { const on = s[k] === i; o[k + i] = () => this.setState({ [k]: i }); o[k + 'bg' + i] = on ? '#111' : '#FFF3C4'; o[k + 'ink' + i] = on ? '#FFD23F' : '#111'; o[k + 'sh' + i] = on ? 'none' : '3px 3px 0 #111'; o[k + 'tr' + i] = on ? 'translate(3px, 3px)' : 'none'; } o[k + 'Help'] = help ? help[s[k]] : (k === 'places' ? 'كام مكان في اللعبة' : 'الثواني لكل مكان'); }
const LV = [['سهل', '#3DDC97'], ['متوسط', '#4D9DFF'], ['صعب', '#FF8A3D'], ['ماكس', '#FF4F9A']];
o.lv = LV.map(([t, c], i) => ({ t, bg: s.lv === i ? c : '#fff', sh: s.lv === i ? 'none' : '3px 3px 0 #111', tr: s.lv === i ? 'translate(3px, 3px)' : 'none', go: () => this.setState({ lv: i }) }));
return o;
}
}
</script>
