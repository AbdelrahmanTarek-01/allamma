class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { g: 0, copied: false };
}
renderVals() {
const s = this.state, G = ["مين الجاسوس؟", "فين دي؟", "الموجة", "حزّورة"];
const o = { game: G[s.g], copyLbl: s.copied ? 'اتنسخ' : 'انسخ', copy: () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1400); } };
G.forEach((_, i) => { const on = s.g === i; o['g' + i] = () => this.setState({ g: i }); o['gb' + i] = on ? '#FFF3C4' : '#fff'; o['gs' + i] = on ? '0 0 0 3px #111' : '3px 3px 0 #111'; });
return o;
}
}
