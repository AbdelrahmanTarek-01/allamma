# Render Blueprint. To use it as a Blueprint, this file must sit at the repo root.
# Otherwise just copy these values into the Render dashboard (see deploy-render.md).
services:
  - type: web
    name: allamma
    runtime: node
    plan: free
    rootDir: 03-code
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
